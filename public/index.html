<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="description" content="GHCi Mobile - Editor Haskell online para sala de aula">
    <title>GHCi Mobile</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/haskell/haskell.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/selection/active-line.min.js"></script>

    <!-- CodeMirror Search Addons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/dialog/dialog.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/search/matchesonscrollbar.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/search/jump-to-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/scroll/annotatescrollbar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/search/matchesonscrollbar.min.js"></script>

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        /* ===== DESIGN SYSTEM ===== */
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f1225;
            --bg-tertiary: #161938;
            --bg-glass: rgba(15, 18, 37, 0.85);
            --border-subtle: rgba(139, 92, 246, 0.08);
            --border-hover: rgba(139, 92, 246, 0.2);
            --accent: #8b5cf6;
            --accent-bright: #a78bfa;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --success: #34d399;
            --error: #f87171;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --radius: 16px;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100svh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.4); }

        /* ===== HEADER ===== */
        .app-header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            z-index: 30;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo-icon ion-icon { color: white; font-size: 18px; }

        .logo-text {
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -0.3px;
        }

        .logo-text span { color: var(--accent-bright); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
        }

        .btn-icon:hover {
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-bright);
        }

        .btn-primary {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: white;
            font-weight: 600;
            font-size: 13px;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-primary:active { transform: scale(0.96); }

        .template-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 6px 28px 6px 10px;
            font-size: 12px;
            color: var(--text-secondary);
            outline: none;
            cursor: pointer;
            font-family: var(--font-sans);
            appearance: none;
            -webkit-appearance: none;
        }

        .template-select:focus { border-color: var(--border-hover); }

        .select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .select-wrapper ion-icon {
            position: absolute;
            right: 6px;
            pointer-events: none;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== MAIN LAYOUT ===== */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        /* ===== EDITOR ===== */
        .editor-section {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .editor-toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 6px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            font-size: 12px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .file-tab .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .lang-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-bright);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .editor-wrapper {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        .editor-wrapper .CodeMirror {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* ===== CODEMIRROR OVERRIDES ===== */
        .CodeMirror {
            height: 100% !important;
            font-family: var(--font-mono) !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
            background: var(--bg-primary) !important;
            color: var(--text-primary) !important;
            padding: 0 !important;
        }

        .CodeMirror-gutters {
            background: var(--bg-secondary) !important;
            border-right: 1px solid var(--border-subtle) !important;
            padding-right: 2px;
        }

        .CodeMirror-linenumber {
            color: var(--text-muted) !important;
            font-size: 12px !important;
            padding: 0 8px 0 4px !important;
        }

        .CodeMirror-activeline-background {
            background: rgba(139, 92, 246, 0.04) !important;
        }

        .CodeMirror-cursor { border-left-color: var(--accent-bright) !important; }
        .CodeMirror-selected { background: rgba(139, 92, 246, 0.15) !important; }
        .CodeMirror-focused .CodeMirror-selected { background: rgba(139, 92, 246, 0.2) !important; }
        .CodeMirror-matchingbracket { color: var(--accent-bright) !important; text-decoration: underline; }

        /* Haskell syntax colors */
        .cm-s-material-darker .cm-keyword { color: #c792ea !important; }
        .cm-s-material-darker .cm-atom { color: #f78c6c !important; }
        .cm-s-material-darker .cm-number { color: #f78c6c !important; }
        .cm-s-material-darker .cm-def { color: #82aaff !important; }
        .cm-s-material-darker .cm-variable { color: #eeffff !important; }
        .cm-s-material-darker .cm-variable-2 { color: #eeffff !important; }
        .cm-s-material-darker .cm-type { color: #ffcb6b !important; }
        .cm-s-material-darker .cm-string { color: #c3e88d !important; }
        .cm-s-material-darker .cm-string-2 { color: #c3e88d !important; }
        .cm-s-material-darker .cm-comment { color: #546e7a !important; font-style: italic; }
        .cm-s-material-darker .cm-operator { color: #89ddff !important; }
        .cm-s-material-darker .cm-builtin { color: #82aaff !important; }

        /* Search dialog styling */
        .CodeMirror-dialog {
            background: var(--bg-tertiary) !important;
            border-bottom: 1px solid var(--border-hover) !important;
            color: var(--text-primary) !important;
            padding: 6px 12px !important;
            font-family: var(--font-mono) !important;
            font-size: 13px !important;
        }

        .CodeMirror-dialog input {
            background: var(--bg-primary) !important;
            border: 1px solid var(--border-hover) !important;
            border-radius: 6px !important;
            color: var(--text-primary) !important;
            padding: 4px 10px !important;
            font-family: var(--font-mono) !important;
            font-size: 13px !important;
            outline: none !important;
        }

        .CodeMirror-dialog input:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 2px var(--accent-glow) !important;
        }

        .CodeMirror-dialog button {
            background: var(--accent) !important;
            border: none !important;
            border-radius: 4px !important;
            color: white !important;
            padding: 3px 10px !important;
            cursor: pointer !important;
            font-size: 12px !important;
        }

        .cm-searching {
            background: rgba(139, 92, 246, 0.3) !important;
            outline: 1px solid var(--accent) !important;
        }

        /* Better wrapped lines indent */
        .CodeMirror-line {
            padding-left: 4px !important;
        }
        
        .CodeMirror-wrap pre.CodeMirror-line {
            text-indent: -1.5em;
            padding-left: 2em !important;
        }

        /* ===== TERMINAL ===== */
        .terminal-panel {
            height: 45%;
            display: flex;
            flex-direction: column;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-subtle);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.3);
            z-index: 20;
            flex-shrink: 0;
        }

        .terminal-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .terminal-hint {
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
        }

        .terminal-prompt-area {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .prompt-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-primary);
            border-radius: 14px;
            padding: 8px 14px;
            border: 1px solid var(--border-subtle);
            transition: border-color 0.2s;
        }

        .prompt-input-wrapper:focus-within { border-color: var(--border-hover); }

        .prompt-label {
            color: var(--accent);
            font-weight: 700;
            font-family: var(--font-mono);
            font-size: 13px;
            flex-shrink: 0;
        }

        #terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
        }

        #terminal-input::placeholder { color: var(--text-muted); }

        #send-expr-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 22px;
            transition: color 0.2s;
            display: flex;
        }

        #send-expr-btn:hover { color: var(--accent); }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .output-line {
            padding: 6px 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-line.success {
            color: var(--success);
            background: rgba(52, 211, 153, 0.06);
            border-left: 3px solid var(--success);
        }

        .output-line.error {
            color: var(--error);
            background: rgba(248, 113, 113, 0.06);
            border-left: 3px solid var(--error);
            font-weight: 500;
        }

        .output-line.info {
            color: var(--accent-bright);
            background: rgba(139, 92, 246, 0.06);
            border-left: 3px solid var(--accent);
        }

        .terminal-placeholder {
            color: var(--text-muted);
            font-size: 12px;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 22px;
            border-radius: 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-hover);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast ion-icon { font-size: 18px; }
        .toast.toast-success ion-icon { color: var(--success); }
        .toast.toast-error ion-icon { color: var(--error); }
        .toast.toast-info ion-icon { color: var(--accent-bright); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .logo-text { display: none; }
            .template-select { max-width: 120px; font-size: 11px; }
            .btn-primary span { display: none; }
            .terminal-hint { display: none; }
        }

        /* ===== UTILITIES ===== */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Toast -->
    <div id="toast" class="toast">
        <ion-icon name="information-circle"></ion-icon>
        <span id="toast-message"></span>
    </div>

    <!-- Header -->
    <header class="app-header">
        <div class="app-logo">
            <div class="logo-icon">
                <ion-icon name="terminal"></ion-icon>
            </div>
            <div class="logo-text">GHCi <span>Mobile</span></div>
        </div>
        <div class="header-actions">
            <div class="select-wrapper">
                <select id="useful-cmds" class="template-select">
                    <option value="">Exemplos</option>
                    <option value=":help">:help</option>
                    <option value=":type ">:type</option>
                    <option value="-- Exemplo: If-Then-Else&#10;oMaior x y =&#10;  if x > y then x else y">If-Then-Else</option>
                    <option value="-- Exemplo: Guards&#10;classifica n&#10;  | n >= 14 = &#34;Aprovado&#34;&#10;  | otherwise = &#34;Reprovado&#34;">Guards</option>
                    <option value="-- Exemplo: Where&#10;somaQuad x y = x2 + y2&#10;  where&#10;    x2 = x * x&#10;    y2 = y * y">Where</option>
                </select>
                <ion-icon name="chevron-down-outline"></ion-icon>
            </div>
            <input type="file" id="file-upload" accept=".hs,.txt" class="hidden">
            <button id="new-btn" class="btn-icon" title="Novo Arquivo"><ion-icon name="document-outline"></ion-icon></button>
            <button id="search-btn" class="btn-icon" title="Pesquisar (Ctrl+F)"><ion-icon name="search-outline"></ion-icon></button>
            <button id="upload-btn" class="btn-icon" title="Abrir Arquivo"><ion-icon name="folder-open-outline"></ion-icon></button>
            <button id="download-btn" class="btn-icon" title="Baixar Código"><ion-icon name="download-outline"></ion-icon></button>
            <button id="install-btn" class="btn-primary hidden" title="Instalar"><ion-icon name="cloud-download-outline"></ion-icon><span>Instalar</span></button>
            <button id="run-btn" class="btn-primary"><ion-icon name="play" id="run-icon"></ion-icon><span id="run-text">Rodar</span></button>
        </div>
    </header>

    <!-- Main content -->
    <main class="app-main">
        <!-- Editor -->
        <section class="editor-section">
            <div class="editor-toolbar">
                <div class="editor-toolbar-left">
                    <div class="file-tab"><span class="dot"></span> exercicio.hs</div>
                </div>
                <span class="lang-badge">Haskell</span>
            </div>
            <div id="editor-wrapper" class="editor-wrapper"></div>
        </section>

        <!-- Terminal -->
        <div class="terminal-panel">
            <div class="terminal-header">
                <div class="terminal-title">
                    <span class="status-dot"></span>
                    Terminal
                </div>
                <span class="terminal-hint">True, False (Case-sensitive)</span>
                <button id="clear-btn" class="btn-icon" title="Limpar"><ion-icon name="trash-outline"></ion-icon></button>
            </div>
            <div class="terminal-prompt-area">
                <div class="prompt-input-wrapper">
                    <span class="prompt-label">ghci&gt;</span>
                    <input type="text" id="terminal-input" placeholder="Digite uma expressão..." autocomplete="off" spellcheck="false">
                    <button id="send-expr-btn"><ion-icon name="arrow-forward-circle"></ion-icon></button>
                </div>
            </div>
            <div id="terminal-output" class="terminal-output">
                <div id="terminal-placeholder" class="terminal-placeholder">Pronto para executar código Haskell</div>
            </div>
        </div>
    </main>

    <script src="app.js?v=1.3"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
