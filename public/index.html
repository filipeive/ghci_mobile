<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>GHCi Mobile</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        },
                        dark: {
                            900: '#020617',
                            800: '#0f172a',
                            700: '#1e293b',
                        }
                    },
                    fontFamily: {
                        mono: ['"Fira Code"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-haskell.min.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style type="text/tailwindcss">
        @layer components {
            .glass {
                @apply bg-white/5 backdrop-blur-lg border border-white/10;
            }
            .btn-icon {
                @apply p-2 rounded-xl hover:bg-white/10 transition-all text-slate-400 hover:text-white flex items-center justify-center;
            }
            .btn-primary {
                @apply bg-primary-600 hover:bg-primary-500 text-white px-4 py-2 rounded-xl font-semibold transition-all flex items-center gap-2 shadow-lg shadow-primary-600/20 active:scale-95;
            }
            .terminal-text {
                @apply font-mono text-sm leading-relaxed;
            }
            .toast {
                @apply fixed bottom-32 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl bg-dark-800 border border-white/10 shadow-2xl text-white text-sm font-semibold flex items-center gap-2 transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-none z-50;
            }
            .toast.show {
                @apply translate-y-0 opacity-100;
            }
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        body { @apply bg-dark-900 text-slate-200 antialiased overflow-hidden; height: 100svh; }
        
        #code-editor, #highlighter-overlay {
            @apply absolute top-0 left-0 w-full h-full font-mono text-[15px] p-4 whitespace-nowrap overflow-auto;
            line-height: 1.5rem; /* Explicit 24px height per line */
            margin: 0;
            box-sizing: border-box;
        }

        #code-editor {
            @apply bg-transparent border-none outline-none resize-none text-transparent caret-white z-10;
        }

        #highlighter-overlay {
            @apply pointer-events-none z-0;
            background: transparent !important;
            scrollbar-width: none; /* Hide for overlay */
        }

        #highlighter-overlay::-webkit-scrollbar { display: none; }

        #highlighter-overlay code {
            @apply bg-transparent p-0 text-inherit;
            font-family: inherit !important;
            font-size: inherit !important;
        }
        
        .line-numbers {
            @apply w-10 text-right pr-3 pt-4 text-slate-700 font-mono text-sm select-none border-r border-white/5 bg-dark-900 overflow-hidden shrink-0;
            line-height: 1.5rem; /* Explicit match editor height */
        }

        /* Prism override for cleaner look */
        .token.comment { color: #64748b; }
        .token.keyword { color: #8b5cf6; }
        .token.function { color: #38bdf8; }
        .token.string { color: #10b981; }
        .token.operator { color: #f472b6; }
    </style>
</head>
<body class="flex flex-col">
    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <ion-icon name="information-circle" id="toast-icon" class="text-primary-500 text-lg"></ion-icon>
        <span id="toast-message">Notificação</span>
    </div>

    <!-- Header -->
    <header class="h-16 flex items-center justify-between px-4 glass z-20 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center shadow-lg shadow-primary-600/30">
                <ion-icon name="terminal" class="text-white text-lg"></ion-icon>
            </div>
            <h1 class="font-bold text-lg tracking-tight hidden sm:block">GHCi <span class="text-primary-500">Mobile</span></h1>
        </div>

        <div class="flex items-center gap-2">
            <div class="relative group">
                <select id="useful-cmds" class="bg-dark-800/50 border border-white/10 rounded-xl px-3 py-1.5 text-sm outline-none focus:border-primary-500/50 transition-all appearance-none pr-8 cursor-pointer">
                    <option value="">Comandos & Exemplos</option>
                    <option value=":help">:help (Ajuda)</option>
                    <option value=":type ">:type (Ver Tipo)</option>
                    <option value="-- Exemplo de If-Then-Else&#10;oMaior x y = if x > y then x else y">Haskell: If-Then-Else</option>
                    <option value="-- Exemplo de Guards (|)&#10;classifica n&#10;  | n >= 14 = &#34;Aprovado&#34;&#10;  | otherwise = &#34;Reprovado&#34;">Haskell: Guards (|)</option>
                    <option value="-- Exemplo de Where&#10;somaQuadrados x y = x2 + y2&#10;  where&#10;    x2 = x * x&#10;    y2 = y * y">Haskell: Where</option>
                    <option value=":quit">:quit (Sair)</option>
                </select>
                <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </div>
            </div>

            <input type="file" id="file-upload" accept=".hs,.txt" class="hidden">
            
            <button id="new-btn" class="btn-icon" title="Novo Arquivo (Limpar Tudo)">
                <ion-icon name="document-outline" class="text-xl"></ion-icon>
            </button>

            <button id="upload-btn" class="btn-icon" title="Abrir Arquivo">
                <ion-icon name="folder-open-outline" class="text-xl"></ion-icon>
            </button>

            <button id="download-btn" class="btn-icon" title="Baixar Código">
                <ion-icon name="download-outline" class="text-xl"></ion-icon>
            </button>

            <button id="install-btn" class="btn-primary hidden" title="Instalar App">
                <ion-icon name="cloud-download-outline"></ion-icon>
                <span class="hidden xs:inline">Instalar</span>
            </button>

            <button id="run-btn" class="btn-primary">
                <ion-icon name="play" id="run-icon"></ion-icon>
                <span id="run-text">Rodar / Carregar</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-0 relative">
        <!-- Editor Section -->
        <section class="flex-1 min-h-0 flex bg-dark-900 overflow-hidden">
            <div id="line-numbers" class="line-numbers shrink-0 overflow-hidden">1</div>
            <div class="flex-1 relative overflow-hidden bg-dark-900">
                <pre id="highlighter-overlay" aria-hidden="true"><code class="language-haskell" id="highlight-content"></code></pre>
                <textarea id="code-editor" spellcheck="false" placeholder="main = print &#34;Olá GHCi Mobile!&#34;"></textarea>
            </div>
        </section>

        <!-- Terminal Panel -->
        <div id="terminal-panel" class="h-[45%] flex flex-col glass rounded-t-[2.5rem] shadow-2xl transition-all duration-300 border-t-white/10 z-20">
            <!-- Terminal Header -->
            <div class="h-12 shrink-0 flex items-center justify-between px-6 border-b border-white/5">
                <div class="flex items-center gap-2 text-slate-400 font-semibold text-xs uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Terminal Output
                </div>
                <div class="hidden md:flex items-center gap-4 text-[10px] text-slate-500 font-mono">
                    <span class="bg-white/5 px-2 py-0.5 rounded border border-white/5">Haskell: True, False (Case-sensitive)</span>
                </div>
                <button id="clear-btn" class="btn-icon">
                    <ion-icon name="trash-outline"></ion-icon>
                </button>
            </div>

            <!-- Terminal Prompt Area (Moved Above Output) -->
            <div class="px-4 py-3 bg-dark-900/50 border-b border-white/5">
                <div class="flex items-center gap-3 bg-dark-800 rounded-2xl px-4 py-2 border border-white/5 focus-within:border-primary-500/30 transition-all">
                    <span class="text-primary-500 font-bold font-mono">ghci></span>
                    <input type="text" id="terminal-input" placeholder="Digite uma expressão..." 
                        class="flex-1 bg-transparent border-none outline-none text-slate-200 font-mono text-sm placeholder:text-slate-600"
                        autocomplete="off" spellcheck="false">
                    <button id="send-expr-btn" class="text-slate-500 hover:text-primary-500 transition-colors">
                        <ion-icon name="arrow-forward-circle" class="text-2xl"></ion-icon>
                    </button>
                </div>
            </div>

            <!-- Terminal Scroll Area -->
            <div id="terminal-output" class="flex-1 overflow-y-auto p-6 font-mono text-sm space-y-3 scroll-smooth">
                <div id="terminal-placeholder" class="text-slate-500 italic text-xs">Aguardando execução...</div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
